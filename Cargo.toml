[package]
name = "rqcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
requirements = { path = "libs/requirements"}
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0.197", features = ["derive"] }

[profile.release]
strip = true
# or strip = "symbols"