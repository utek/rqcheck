[package]
name = "rqcheck"
version = "0.1.0"
edition = "2021"

[lib]
name = "rqcheck"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
requirements = { path = "libs/requirements"}
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"
assert_matches = "1.5"
serial_test = "3.0"

[profile.release]
strip = true
# or strip = "symbols"